  ctx.lineTo(px(bd.hip/2), py(0)); ctx.lineTo(px(bd.sw/2), py(bd.sh));
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#111';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.ellipse(px(s*bd.hip*0.18), py(3), 8*sc, 4*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(px(s*bd.hip*0.18+4*sc), py(0), 3*sc, 8*sc, 1*sc); ctx.fill();
  });
  ctx.fillStyle = dressCol;
  ctx.beginPath();
  ctx.roundRect(px(-bd.sw/2), py(bd.sh), bd.sw*sc, bd.sh*sc, [0,0,6*sc,6*sc]); ctx.fill();
  if (!isBack) {
    ctx.fillStyle = '#f0e8e0';
    ctx.beginPath(); ctx.roundRect(px(-6), py(bd.sh), 12*sc, bd.sh*0.65*sc, 2*sc); ctx.fill();
    ctx.fillStyle = dressCol;
    ctx.beginPath(); ctx.moveTo(px(0), py(bd.sh-4)); ctx.lineTo(px(-bd.sw/2), py(bd.sh)); ctx.lineTo(px(-bd.sw/2), py(bd.sh-18)); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px(0), py(bd.sh-4)); ctx.lineTo(px(bd.sw/2), py(bd.sh)); ctx.lineTo(px(bd.sw/2), py(bd.sh-18)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = accentCol;
    ctx.beginPath(); ctx.arc(px(-8), py(bd.sh-10), 4*sc, 0, Math.PI*2); ctx.fill();
  }
  const armLen = 58, armW = 8;
  ctx.fillStyle = dressCol;
  ctx.beginPath(); ctx.roundRect(px(-bd.sw/2-armW*sc+2), py(bd.sh), armW*sc, armLen*sc, 4*sc); ctx.fill();
  ctx.beginPath(); ctx.roundRect(px(bd.sw/2-2), py(bd.sh), armW*sc, armLen*sc, 4*sc); ctx.fill();
  ctx.fillStyle = skinCol;
  ctx.beginPath(); ctx.ellipse(px(-bd.sw/2-armW*sc/2+2), py(armLen-10), 6*sc, 8*sc, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px(bd.sw/2+armW*sc/2-2), py(armLen-10), 6*sc, 8*sc, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skinCol;
  ctx.beginPath(); ctx.roundRect(px(-bd.nw/2), py(bd.sh+bd.nh), bd.nw*sc, bd.nh*sc, 4*sc); ctx.fill();
  ctx.strokeStyle = accentCol; ctx.lineWidth = 2*sc;
  ctx.beginPath();
  ctx.arc(px(0), py(bd.sh+bd.nh+bd.nh*0.5), (bd.nw*0.7)*sc, Math.PI*0.2, Math.PI*0.8);
  ctx.stroke();
  const headH = bd.hw*1.18;
  const headY = bd.sh + bd.nh + headH;
  ctx.fillStyle = skinCol;
  ctx.beginPath(); ctx.ellipse(px(0), py(bd.sh+bd.nh+headH/2), bd.hw/2*sc, headH/2*sc, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px(0), py(bd.sh+bd.nh+4), bd.hw/2.3*sc, 9*sc, 0, 0, Math.PI); ctx.fill();
  const eyeY = bd.sh + bd.nh + headH*0.55;
  const eyeSpan = bd.hw*0.22;
  const mouthY = bd.sh + bd.nh + headH*0.18;
  if (!isBack) {
    drawFaceF(ctx, face, px, py, eyeY, eyeSpan, mouthY, bd, sc);
    if (hair > 0) drawHairF(ctx, hair, px, py, bd, headY, headH, sc);
    if (hat > 0)  drawHat(ctx, hat, px, py, bd, headY, headH, sc);
  }
}

function drawFaceM(ctx, faceId, px, py, eyeY, eyeSpan, mouthY, bd, sc) {
  const eyeR = 4*sc;
  ctx.fillStyle = '#fff';
  [-1,1].forEach(s => { ctx.beginPath(); ctx.ellipse(px(s*eyeSpan), py(eyeY), eyeR*1.3, eyeR, 0, 0, Math.PI*2); ctx.fill(); });
  const pupilCol = ['#1a0a00','#1a0020','#002010','#100020'][faceId%4];
  ctx.fillStyle = pupilCol;
  const lookX = faceId===1?1.5:faceId===5?-0.5:0;
  [-1,1].forEach(s => { ctx.beginPath(); ctx.arc(px(s*eyeSpan+lookX*sc), py(eyeY), eyeR*0.65, 0, Math.PI*2); ctx.fill(); });
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2.5*sc; ctx.lineCap = 'round';
  const browAngles = [0,-0.3,0,0.15,0.2,0.25,-0.2,-0.15,0,0.1];
  const bAngle = browAngles[faceId]||0;
  [-1,1].forEach(s => {
    ctx.save(); ctx.translate(px(s*eyeSpan), py(eyeY+9)); ctx.rotate(s*bAngle);
    ctx.beginPath(); ctx.moveTo(-8*sc,0); ctx.lineTo(8*sc,0); ctx.stroke(); ctx.restore();
  });
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2*sc;
  if (faceId===0) { ctx.beginPath(); ctx.moveTo(px(-8),py(mouthY)); ctx.lineTo(px(8),py(mouthY)); ctx.stroke(); }
  else if (faceId===1) { ctx.beginPath(); ctx.moveTo(px(-9),py(mouthY+3)); ctx.quadraticCurveTo(px(0),py(mouthY-4),px(9),py(mouthY+3)); ctx.stroke(); }
  else if (faceId===5) { ctx.beginPath(); ctx.moveTo(px(-8),py(mouthY+4)); ctx.quadraticCurveTo(px(0),py(mouthY-2),px(8),py(mouthY+4)); ctx.stroke(); }
  else if (faceId===6) { ctx.beginPath(); ctx.moveTo(px(-6),py(mouthY)); ctx.quadraticCurveTo(px(3),py(mouthY+5),px(9),py(mouthY+2)); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(px(-8),py(mouthY)); ctx.quadraticCurveTo(px(0),py(mouthY+3),px(8),py(mouthY)); ctx.stroke(); }
  if (faceId===2) {
    ctx.fillStyle = '#2a1800';
    ctx.beginPath(); ctx.ellipse(px(0),py(mouthY-12),14*sc,16*sc,0,0,Math.PI); ctx.fill();
    [-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(px(s*14),py(mouthY+4),5*sc,10*sc,0,0,Math.PI*2);ctx.fill();});
  }
  if (faceId===3) {
    ctx.fillStyle='#1a0e00';
    ctx.beginPath();ctx.ellipse(px(-5),py(mouthY+6),7*sc,4*sc,0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(px(5),py(mouthY+6),7*sc,4*sc,-0.3,0,Math.PI*2);ctx.fill();
  }
  if (faceId===4) {
    ctx.strokeStyle='#cc5555';ctx.lineWidth=2*sc;
    ctx.beginPath();ctx.moveTo(px(-10),py(eyeY+8));ctx.lineTo(px(-4),py(mouthY+8));ctx.stroke();
    ctx.strokeStyle='#ff8888';ctx.lineWidth=1*sc;ctx.stroke();
  }
  if (faceId===7) {
    ctx.strokeStyle='#a06060';ctx.lineWidth=2*sc;
    ctx.beginPath();ctx.moveTo(px(0),py(eyeY-4));ctx.lineTo(px(3),py(eyeY-10));ctx.lineTo(px(-1),py(eyeY-16));ctx.stroke();
  }
  if (faceId===8) {
    ctx.fillStyle='#eee';ctx.beginPath();ctx.roundRect(px(7),py(mouthY-1),18*sc,4*sc,2*sc);ctx.fill();
    ctx.fillStyle='#e8c96e';ctx.beginPath();ctx.roundRect(px(22),py(mouthY-1),5*sc,4*sc,1*sc);ctx.fill();
  }
}

function drawFaceF(ctx, faceId, px, py, eyeY, eyeSpan, mouthY, bd, sc) {
  const eyeR = 4.2*sc;
  const eyeColors = ['#1a3a5a','#3a1a1a','#1a3a1a','#3a1a3a','#2a2a1a','#1a2a3a','#3a0a0a','#1a1a2a','#3a2a0a','#0a2a3a'];
  ctx.fillStyle = eyeColors[faceId%eyeColors.length]+'66';
  [-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(px(s*eyeSpan),py(eyeY+2),eyeR*1.8,eyeR*0.7,0,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#fff';
  [-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(px(s*eyeSpan),py(eyeY),eyeR*1.4,eyeR,0,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#1a0a30';
  [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(px(s*eyeSpan),py(eyeY),eyeR*0.7,0,Math.PI*2);ctx.fill();});
  ctx.strokeStyle='#111';ctx.lineWidth=1.5*sc;
  [-1,1].forEach(s=>{
    for(let l=-2;l<=2;l++){
      ctx.beginPath();ctx.moveTo(px(s*eyeSpan+l*2.5),py(eyeY+eyeR));ctx.lineTo(px(s*eyeSpan+l*3),py(eyeY+eyeR+4));ctx.stroke();
    }
  });
  ctx.strokeStyle='#331a00';ctx.lineWidth=1.8*sc;ctx.lineCap='round';
  [-1,1].forEach(s=>{
    ctx.beginPath();ctx.moveTo(px(s*eyeSpan-8),py(eyeY+10));ctx.quadraticCurveTo(px(s*eyeSpan),py(eyeY+12),px(s*eyeSpan+8*s),py(eyeY+9));ctx.stroke();
  });
  ctx.fillStyle='#ff888844';
  [-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(px(s*(eyeSpan+8)),py(mouthY+6),9*sc,5*sc,0,0,Math.PI*2);ctx.fill();});
  ctx.strokeStyle=SKINS[0]+'88';ctx.lineWidth=1.5*sc;
  ctx.beginPath();ctx.arc(px(0),py((eyeY+mouthY)/2),3*sc,0.2*Math.PI,0.8*Math.PI);ctx.stroke();
  const lipColors=['#c0392b','#e74c3c','#c0392b','#ff1493','#a04040','#d35400','#e91e63','#880000','#c0392b','#8e44ad'];
  ctx.fillStyle = lipColors[faceId%lipColors.length];
  ctx.beginPath();
  ctx.moveTo(px(-8),py(mouthY));
  ctx.quadraticCurveTo(px(-4),py(mouthY+5),px(0),py(mouthY+3));
  ctx.quadraticCurveTo(px(4),py(mouthY+5),px(8),py(mouthY));
  ctx.quadraticCurveTo(px(4),py(mouthY-3),px(0),py(mouthY-2));
  ctx.quadraticCurveTo(px(-4),py(mouthY-3),px(-8),py(mouthY));
  ctx.closePath();ctx.fill();
  if (faceId===2) {
    ctx.fillStyle='#8e44ad44';
    [-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(px(s*eyeSpan),py(eyeY+1),eyeR*1.6,eyeR*0.8,0,0,Math.PI*2);ctx.fill();});
  }
  if (faceId===4) {
    ctx.strokeStyle='#cc5555';ctx.lineWidth=1.5*sc;
    ctx.beginPath();ctx.moveTo(px(-10),py(eyeY+6));ctx.lineTo(px(-5),py(mouthY+6));ctx.stroke();
  }
  if (faceId===7) {
    ctx.fillStyle='#3a1a5544';
    ctx.beginPath();ctx.ellipse(px(-12),py(eyeY+2),7*sc,5*sc,0,0,Math.PI*2);ctx.fill();
  }
  if (faceId===8) {
    ctx.fillStyle='#eee';ctx.beginPath();ctx.roundRect(px(8),py(mouthY-2),14*sc,3*sc,2*sc);ctx.fill();
    ctx.fillStyle='#e8c96e';ctx.beginPath();ctx.roundRect(px(20),py(mouthY-2),4*sc,3*sc,1*sc);ctx.fill();
  }
}

function drawHairM(ctx, hairId, px, py, bd, headY, headH, sc) {
  const hc = HAIR_COLORS_M[hairId % HAIR_COLORS_M.length];
  const hw = bd.hw / 2;
  ctx.fillStyle = hc; ctx.strokeStyle = hc;
  if (hairId===1) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY-5),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffffff33';ctx.lineWidth=2*sc;
    ctx.beginPath();ctx.moveTo(px(-hw*0.5),py(headY-8));ctx.quadraticCurveTo(px(0),py(headY-12),px(hw*0.5),py(headY-8));ctx.stroke();
  } else if (hairId===2) {
    ctx.fillStyle=hc;
    ctx.beginPath();ctx.ellipse(px(0),py(headY+2),hw*sc,9*sc,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(px(-4*sc),py(headY+14),hw*0.8*sc,16*sc,-0.2,Math.PI,Math.PI*2);ctx.fill();
  } else if (hairId===3) {
    ctx.beginPath();ctx.moveTo(px(-4),py(headY-2));ctx.lineTo(px(-3),py(headY+28));ctx.lineTo(px(3),py(headY+28));ctx.lineTo(px(4),py(headY-2));ctx.closePath();ctx.fill();
  } else if (hairId===4) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
  } else if (hairId===5) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    [-1,1].forEach(s=>{ctx.lineWidth=8*sc;ctx.strokeStyle=hc;ctx.beginPath();ctx.moveTo(px(s*hw),py(headY));ctx.quadraticCurveTo(px(s*(hw+5)),py(headY-20),px(s*(hw+1)),py(headY-70));ctx.stroke();});
  } else if (hairId===6) {
    for(let i=-3;i<=3;i++){ctx.beginPath();ctx.arc(px(i*7),py(headY+5),7*sc,0,Math.PI*2);ctx.fill();}
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,8*sc,0,Math.PI,Math.PI*2);ctx.fill();
  } else if (hairId===7) {
    ctx.beginPath();ctx.ellipse(px(-4),py(headY+4),hw*0.9*sc,9*sc,-0.2,Math.PI,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.roundRect(px(-14),py(headY+5),14*sc,8*sc,3*sc);ctx.fill();
  } else if (hairId===8) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffffff44';ctx.lineWidth=1.5*sc;
    ctx.beginPath();ctx.moveTo(px(-3),py(headY-2));ctx.lineTo(px(-3),py(headY+10));ctx.stroke();
  } else if (hairId===9) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY+1),hw*sc,6*sc,0,Math.PI,Math.PI*2);ctx.fill();
  }
}

function drawHairF(ctx, hairId, px, py, bd, headY, headH, sc) {
  const hc = HAIR_COLORS_F[hairId % HAIR_COLORS_F.length];
  const hw = bd.hw / 2;
  ctx.fillStyle = hc;
  if (hairId===1) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.lineWidth=10*sc;ctx.strokeStyle=hc;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(px(hw-2),py(headY));ctx.quadraticCurveTo(px(hw+10),py(headY-15),px(hw+5),py(headY-40));ctx.stroke();
    ctx.fillStyle='#e8c96e';ctx.beginPath();ctx.arc(px(hw-2),py(headY+2),3*sc,0,Math.PI*2);ctx.fill();
  } else if (hairId===2) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    [-1,1].forEach(s=>{ctx.lineWidth=10*sc;ctx.strokeStyle=hc;ctx.beginPath();ctx.moveTo(px(s*hw),py(headY));ctx.lineTo(px(s*(hw+2)),py(headY-25));ctx.stroke();});
    ctx.fillStyle=hc;ctx.beginPath();ctx.ellipse(px(0),py(headY+8),hw*0.9*sc,6*sc,0,Math.PI,Math.PI*2);ctx.fill();
  } else if (hairId===3) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    [-1,1].forEach(s=>{ctx.lineWidth=10*sc;ctx.strokeStyle=hc;ctx.beginPath();ctx.moveTo(px(s*hw),py(headY));ctx.quadraticCurveTo(px(s*(hw+6)),py(headY-30),px(s*(hw+3)),py(headY-80));ctx.stroke();});
  } else if (hairId===4) {
    for(let i=-3;i<=3;i++){ctx.beginPath();ctx.arc(px(i*6),py(headY+6),7*sc,0,Math.PI*2);ctx.fill();}
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,8*sc,0,Math.PI,Math.PI*2);ctx.fill();
    [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(px(s*hw),py(headY-15),5*sc,0,Math.PI*2);ctx.fill();});
  } else if (hairId===5) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.lineWidth=6*sc;ctx.strokeStyle=hc;
    ctx.beginPath();ctx.moveTo(px(hw-3),py(headY));ctx.lineTo(px(hw),py(headY-15));ctx.stroke();
    for(let i=0;i<5;i++){
      const y=headY-15-i*10;
      ctx.lineWidth=(4-i*0.3)*sc;ctx.strokeStyle=i%2===0?hc:HAIR_COLORS_F[(hairId+1)%HAIR_COLORS_F.length];
      ctx.beginPath();ctx.moveTo(px(hw-4),py(y));ctx.lineTo(px(hw+4),py(y-5));ctx.stroke();
    }
  } else if (hairId===6) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(px(4),py(headY+22),10*sc,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff44';ctx.beginPath();ctx.arc(px(2),py(headY+20),4*sc,0,Math.PI*2);ctx.fill();
  } else if (hairId===7) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    [-1,1].forEach(s=>{
      ctx.lineWidth=9*sc;ctx.strokeStyle=hc;
      ctx.beginPath();
      ctx.moveTo(px(s*hw),py(headY));
      ctx.quadraticCurveTo(px(s*(hw+8)),py(headY-20),px(s*(hw+2)),py(headY-40));
      ctx.quadraticCurveTo(px(s*(hw+10)),py(headY-55),px(s*(hw+4)),py(headY-70));
      ctx.stroke();
    });
  } else if (hairId===8) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY),hw*sc,10*sc,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(px(-hw),py(headY+5));ctx.quadraticCurveTo(px(0),py(headY+12),px(hw*0.6),py(headY+3));ctx.lineWidth=8*sc;ctx.strokeStyle=hc;ctx.stroke();
  } else if (hairId===9) {
    ctx.beginPath();ctx.ellipse(px(0),py(headY-2),(hw+2)*sc,12*sc,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(px(0),py(headY+4),(hw+2)*sc,8*sc,0,0,Math.PI);ctx.fill();
  }
}

function drawHat(ctx, hatId, px, py, bd, headY, headH, sc) {
  const hw = bd.hw / 2;
  const eyeY = headY - headH * 0.45;
  if (hatId===1) {
    ctx.fillStyle = '#1a0e00';
    ctx.beginPath(); ctx.ellipse(px(0), py(headY+2), (hw+10)*sc, 5*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(px(-hw+2), py(headY+2+26), (hw*2-4)*sc, 26*sc, 4*sc); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(px(0), py(headY+2+26), (hw-6)*sc, 4*sc, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c96e';
    ctx.fillRect(px(-hw+2), py(headY+2+4+2), (hw*2-4)*sc, 4*sc);
  } else if (hatId===2) {
    ctx.fillStyle = '#1a2e3a';
    ctx.beginPath(); ctx.ellipse(px(0), py(headY), hw*sc, 14*sc, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px(hw*0.5), py(headY), (hw+6)*sc, 4*sc, 0.15, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#e8c96e';
    ctx.beginPath(); ctx.arc(px(0), py(headY+12), 3*sc, 0, Math.PI*2); ctx.fill();
  } else if (hatId===3) {
    ctx.fillStyle = '#8b0000';
    ctx.beginPath(); ctx.ellipse(px(0), py(headY+4), (hw+1)*sc, (headH*0.5+2)*sc, 0, Math.PI*0.5, Math.PI*2.5); ctx.fill();
    ctx.beginPath(); ctx.arc(px(hw-1), py(headY+3), 5*sc, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff333322';
    for (let i=0; i<4; i++) { ctx.beginPath(); ctx.arc(px(-hw+5+i*6), py(headY+6), 2.5*sc, 0, Math.PI*2); ctx.fill(); }
  } else if (hatId===4) {
    ctx.fillStyle = '#5c3d11';
    ctx.beginPath(); ctx.ellipse(px(0), py(headY+3), (hw+14)*sc, 5*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px(-hw+2), py(headY+3));
    ctx.lineTo(px(-hw+6), py(headY+3+32));
    ctx.lineTo(px(-3),    py(headY+3+36));
    ctx.lineTo(px(3),     py(headY+3+36));
    ctx.lineTo(px(hw-6),  py(headY+3+32));
    ctx.lineTo(px(hw-2),  py(headY+3));
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8b6333';
    ctx.fillRect(px(-hw+2), py(headY+3+5), (hw*2-4)*sc, 3*sc);
  } else if (hatId===5) {
    const span = hw*0.55, lensW = (hw*0.55)*sc, lensH = 9*sc, gap = hw*0.08;
    ctx.strokeStyle='#111'; ctx.lineWidth = 2*sc; ctx.fillStyle='#1a3a5a88';
    ctx.beginPath(); ctx.roundRect(px(-(span+gap)), py(eyeY+5), lensW, lensH, 3*sc); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(px(gap),         py(eyeY+5), lensW, lensH, 3*sc); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(-gap), py(eyeY+9)); ctx.lineTo(px(gap), py(eyeY+9)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(-(span+gap)), py(eyeY+9)); ctx.lineTo(px(-hw-2), py(eyeY+6)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(gap+span),     py(eyeY+9)); ctx.lineTo(px(hw+2),  py(eyeY+6)); ctx.stroke();
  } else if (hatId===6) {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(px(-11), py(eyeY), 9*sc, 7*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2.2*sc;
    ctx.beginPath(); ctx.moveTo(px(-20), py(eyeY)); ctx.lineTo(px(-hw-2), py(eyeY-2)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(-2), py(eyeY));  ctx.lineTo(px(hw+2),  py(eyeY-2)); ctx.stroke();
  } else if (hatId===7) {
    ctx.fillStyle = '#2c2c4e';
    ctx.beginPath(); ctx.ellipse(px(-3), py(headY+8), (hw+4)*sc, 13*sc, -0.15, Math.PI*0.05, Math.PI*1.95); ctx.fill();
    ctx.fillStyle = '#1a1a30';
    ctx.beginPath(); ctx.ellipse(px(0), py(headY), hw*sc, 4*sc, 0, 0, Math.PI*2); ctx.fill();
  } else if (hatId===8) {
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.ellipse(px(0), py(headY+2), (hw+16)*sc, 6*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(px(-hw+4), py(headY+2+30), (hw*2-8)*sc, 30*sc, [2*sc,2*sc,0,0]); ctx.fill();
    ctx.fillStyle = '#eeeeee';
    ctx.fillRect(px(-hw+4), py(headY+2+3+1), (hw*2-8)*sc, 3*sc);
  } else if (hatId===9) {
    ctx.strokeStyle = '#e8c96e'; ctx.lineWidth = 3*sc;
    ctx.beginPath(); ctx.arc(px(0), py(headY), (hw+2)*sc, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
    ctx.fillStyle = '#e8c96e';
    for (let i = -2; i <= 2; i++) {
      const a = Math.PI * 1.5 + i * 0.22, r = (hw+2)*sc;
      const cx2 = px(0) + Math.cos(a)*r, cy2 = py(headY) - Math.sin(a)*r;
      ctx.beginPath(); ctx.moveTo(cx2, cy2);
      ctx.lineTo(cx2 + Math.cos(a)*6*sc, cy2 - Math.sin(a)*6*sc);
      ctx.lineTo(cx2 + Math.cos(a+0.15)*3*sc, cy2 - Math.sin(a+0.15)*3*sc);
      ctx.closePath(); ctx.fill();
    }
  }
}

// ── Кеш спрайтов: рисуем drawChar один раз → переносим как картинку ──
const SPRITE_W = 110, SPRITE_H = 200;
const _spriteCache = new Map();
function getSprite(look) {
  const key = [look.gender, look.skin, look.body, look.face, look.hair, look.hat].join('.');
  if (_spriteCache.has(key)) return _spriteCache.get(key);
  const off = document.createElement('canvas');
  off.width = SPRITE_W; off.height = SPRITE_H;
  drawChar(off.getContext('2d'), SPRITE_W, SPRITE_H, look);
  _spriteCache.set(key, off);
  return off;
}

function rndLook() {
  return {
    gender: Math.random() < 0.5 ? 0 : 1,
    skin:   Math.floor(Math.random() * 6),
    body:   Math.floor(Math.random() * 4),
    face:   Math.floor(Math.random() * 10),
    hair:   Math.floor(Math.random() * 10),
    hat:    Math.floor(Math.random() * 10),
  };
}

// ── Рендер персонажа на сцену ─────────────────────────────────────────
function drawCharacter(obj, isPlayer) {
  const p = w2s(obj.r, obj.c);
  const wx = TS * 0.5, wy = TS * 0.5 * ISO_Y;
  const isDead = obj.hp <= 0;
  const bob = isDead ? 0 : Math.sin(obj.walkPhase || 0) * 2.5;
  const hpMax = obj.hpMax || 100;

  // Лужа крови под трупом
  if (isDead) {
    ctx.fillStyle = 'rgba(120,10,10,.55)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 3, wx * 0.55, wy * 0.85, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(180,20,20,.7)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 2, wx * 0.32, wy * 0.5, 0, 0, Math.PI*2);
    ctx.fill();
  } else {
    // тень
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 2, wx * 0.34, wy * 0.6, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // спрайт
  const sprite = getSprite(obj.look);
  const scale = obj.isBoss ? 2.5 : 1.95;
  const sh = TS * scale;
  // sw искусственно расширяем — спрайт сам по себе узкий (110x200=0.55 ratio).
  // Делаем 0.72, чтобы персонаж выглядел более «крепким».
  const sw = sh * 0.72;

  if (isDead) {
    // Лежащий спрайт — поворот на 90° вокруг ног
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.PI / 2);
    ctx.globalAlpha = 0.85;
    ctx.drawImage(sprite, Math.round(-sw/2), Math.round(-sh*0.94), sw, sh);
    ctx.globalAlpha = 1;
    ctx.restore();
  } else {
    ctx.drawImage(sprite, Math.round(p.x - sw/2), Math.round(p.y - sh*0.94 + bob), sw, sh);
  }

  // Рука с оружием (только живой). Плечо — на уровне груди (примерно 45% высоты спрайта снизу),
  // смещение вбок перпендикулярно направлению, чтобы рука росла из плеча.
  if (!isDead && obj.angle != null) {
    const armLen = TS * (obj.isBoss ? 0.5 : 0.36);
    const dx = Math.cos(obj.angle), dy = Math.sin(obj.angle);
    const sx = (dx - dy) * 0.5;
    const sy = (dx + dy) * 0.5 * ISO_Y;
    // плечо на 17% от низа спрайта = центр торса (грудь).
    // По геометрии drawChar голова на экране занимает 29-52% от sh снизу,
    // поэтому всё что выше 0.21 — в области головы/шеи (нож в голове).
    const shY = p.y - sh * 0.17 + bob;
    const dirLen = Math.hypot(sx, sy) || 1;
    const perpX = -sy / dirLen;
    const perpY =  sx / dirLen;
    const shoulderD = TS * (obj.isBoss ? 0.14 : 0.10);
    const hx = p.x + perpX * shoulderD;
    const hy = shY + perpY * shoulderD;
    const ex = hx + sx * armLen;
    const ey = hy + sy * armLen;
    // рука (тёмный рукав)
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = obj.isBoss ? 6 : 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); ctx.stroke();
    // оружие
    const wepKey = obj === player ? currentWeapon : (obj.weapon || 'pistol');
    const wepCfg = WEAPON_FX_CFG[wepKey] || {};
    const isMelee = !!wepCfg.melee;
    if (isMelee) {
      // ближнее оружие — короткое, светлое (нож/бита/катана)
      let len = 0.2, col = '#bbb', w = 3;
      if (wepKey === 'blade_long') { len = 0.36; col = '#cfcfcf'; w = 2.5; }
      else if (wepKey === 'bat')   { len = 0.28; col = '#8b5a2b'; w = 4; }
      else if (wepKey === 'chain') { len = 0.26; col = '#888'; w = 2.5; }
      else if (wepKey === 'fists') { len = 0;    col = '#bbb'; w = 0; }
      else if (wepKey === 'brass') { len = 0.06; col = '#e8c96e'; w = 5; }
      if (len > 0) {
        ctx.strokeStyle = col; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(ex, ey);
        ctx.lineTo(ex + sx * TS * len, ey + sy * TS * len); ctx.stroke();
      } else {
        // кулак — кружок на конце руки
        ctx.fillStyle = obj.look ? (SKINS[obj.look.skin] || SKINS[0]) : '#ddd';
        ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI*2); ctx.fill();
      }
    } else {
      // стрелковое — длинная тёмная черта
      const len = wepKey === 'sniper' || wepKey === 'rifle' ? 0.4 : (wepKey === 'rpg' ? 0.5 : 0.28);
      ctx.strokeStyle = '#333'; ctx.lineWidth = wepKey === 'rpg' ? 6 : 4;
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.lineTo(ex + sx * TS * len, ey + sy * TS * len); ctx.stroke();
    }
  }

  // HP-бар (только живой и не игрок 100%)
  if (!isDead && (isPlayer || obj.hp < hpMax)) {
    const barW = TS * (obj.isBoss ? 0.8 : 0.5), barH = obj.isBoss ? 6 : 4;
    const by = p.y - sh - (obj.isBoss ? 16 : 10);
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(p.x - barW/2 - 1, by - 1, barW + 2, barH + 2);
    const hpRatio = obj.hp / hpMax;
    ctx.fillStyle = hpRatio > 0.5 ? '#5dd55d' : (hpRatio > 0.25 ? '#dda53a' : '#dd3a3a');
    ctx.fillRect(p.x - barW/2, by, barW * hpRatio, barH);
    if (obj.isBoss) {
      ctx.fillStyle = '#c060ff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('★ ' + (obj.name || 'БОСС') + ' ★', p.x, by - 5);
    }
  }

  // "☠ МЕРТВ" над трупом
  if (isDead) {
    const ty = p.y - TS * 0.7;
    ctx.globalAlpha = 0.85;
    ctx.font = 'bold ' + Math.floor(TS * 0.22) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText('☠ МЕРТВ', p.x + 1, ty + 1);
    ctx.fillStyle = '#ff4444';
    ctx.fillText('☠ МЕРТВ', p.x, ty);
    ctx.globalAlpha = 1;
  }
}

function drawBullet(b) {
  const p1 = w2s(b.r, b.c);
  const p2 = w2s(b.r - b.vr * 0.05, b.c - b.vc * 0.05);
  ctx.strokeStyle = b.color;
  ctx.lineWidth = b.thick ? 4 : 2.5;
  ctx.lineCap = 'round';
  ctx.shadowColor = b.color;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(p2.x, p2.y - isoH(0.5));
  ctx.lineTo(p1.x, p1.y - isoH(0.5));
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawMuzzle(m) {
  const p = w2s(m.r, m.c);
  const t = m.life / m.max;
  const size = TS * 0.35 * t;
  ctx.fillStyle = 'rgba(255,220,120,' + (t * 0.9) + ')';
  ctx.beginPath();
  ctx.arc(p.x, p.y - isoH(0.55), size, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowColor = '#ffd76b';
  ctx.shadowBlur = 20 * t;
  ctx.fillStyle = 'rgba(255,255,255,' + (t * 0.7) + ')';
  ctx.beginPath();
  ctx.arc(p.x, p.y - isoH(0.55), size * 0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawGrenade(g) {
  const p = w2s(g.r, g.c);
  const k = g.t / g.T;
  const liftPx = isoH(1.1) * 4 * k * (1 - k);
  const cx = p.x;
  const cy = p.y - isoH(0.2) - liftPx;
  // тень на земле
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y - isoH(0.05), 5, 2.5, 0, 0, Math.PI*2);
  ctx.fill();
  if (g.kind === 'molotov') {
    // бутылка с горючим — продолговатая, с пламенем сверху
    ctx.fillStyle = '#3a2a14';
    ctx.beginPath(); ctx.ellipse(cx, cy, 3, 6, k * Math.PI * 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a07040';
    ctx.beginPath(); ctx.ellipse(cx, cy, 1.8, 4.5, k * Math.PI * 2, 0, Math.PI*2); ctx.fill();
    // пламя
    ctx.fillStyle = '#ff8030';
    ctx.beginPath(); ctx.arc(cx, cy - 7, 2.8 + Math.sin(g.t*40)*0.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd76b';
    ctx.beginPath(); ctx.arc(cx, cy - 7, 1.4, 0, Math.PI*2); ctx.fill();
  } else {
    // граната
    ctx.fillStyle = '#2a2e1a';
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5a5a30'; ctx.lineWidth = 1; ctx.stroke();
    // искра-фитиль
    if ((g.t * 18) % 1 > 0.5) {
      ctx.fillStyle = '#ffd76b';
      ctx.beginPath(); ctx.arc(cx + 2, cy - 4, 1.6, 0, Math.PI*2); ctx.fill();
    }
  }
}

// Прицел-конус: показывает дальность и разброс выбранного оружия.
// Лучом упирается в первое препятствие на линии прицела.
function drawAimGuide() {
  if (player.hp <= 0) return;
  if (!joyR.active) return;
  if (Math.abs(joyR.dx) < 0.1 && Math.abs(joyR.dy) < 0.1) return;
  const cfg = WEAPON_FX_CFG[currentWeapon];
  if (!cfg || cfg.melee) return;

  const angle = player.angle;
  const range = cfg.range || 8;
  const spread = cfg.spread || 0;
  const color = cfg.color || '#ffea80';
  const isSniper = currentWeapon === 'sniper';

  // Найдём фактическую длину луча — упираемся в первое препятствие
  let hitDist = range;
  for (let d = 0.3; d < range; d += 0.15) {
    const rr = player.r + Math.sin(angle) * d;
    const cc = player.c + Math.cos(angle) * d;
    if (isBlocked(rr, cc)) { hitDist = d; break; }
  }

  // Центр луча — из плеча оружия (как у руки)
  const p = w2s(player.r, player.c);
  const sh = TS * 1.95;
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const sx = (dx - dy) * 0.5;
  const sy = (dx + dy) * 0.5 * ISO_Y;
  const dirLen = Math.hypot(sx, sy) || 1;
  const perpX = -sy / dirLen, perpY = sx / dirLen;
  const shoulderD = TS * 0.10;
  const startX = p.x + perpX * shoulderD + sx * TS * 0.45;
  const startY = p.y - sh * 0.17 + perpY * shoulderD + sy * TS * 0.45;

  // Конечная точка луча по миру → экран
  const endR = player.r + Math.sin(angle) * hitDist;
  const endC = player.c + Math.cos(angle) * hitDist;
  const ep = w2s(endR, endC);
  const endX = ep.x;
  const endY = ep.y - isoH(0.3); // на высоте груди

  if (isSniper) {
    // ── СНАЙПЕРКА: лазерный луч ──
    // тонкая яркая красная линия с пунктиром
    ctx.save();
    ctx.strokeStyle = 'rgba(255,40,40,.85)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([6, 4]);
    ctx.lineDashOffset = -(performance.now() * 0.04) % 10;
    ctx.shadowColor = '#ff3030';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(endX, endY);
    ctx.stroke();
    // яркая точка прицела на конце
    ctx.setLineDash([]);
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff5050';
    ctx.beginPath(); ctx.arc(endX, endY, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(endX, endY, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else {
    // ── ОБЫЧНОЕ ОРУЖИЕ: конус с углом = spread ──
    const halfAngle = Math.max(0.01, spread); // минимальная ширина чтобы было видно
    const fanA = angle - halfAngle;
    const fanB = angle + halfAngle;
    const fanR_A = player.r + Math.sin(fanA) * hitDist;
    const fanC_A = player.c + Math.cos(fanA) * hitDist;
    const fanR_B = player.r + Math.sin(fanB) * hitDist;
    const fanC_B = player.c + Math.cos(fanB) * hitDist;
    const pA = w2s(fanR_A, fanC_A);
    const pB = w2s(fanR_B, fanC_B);
    const aX = pA.x, aY = pA.y - isoH(0.3);
    const bX = pB.x, bY = pB.y - isoH(0.3);

    ctx.save();
    // заливка-градиент
    const grd = ctx.createRadialGradient(startX, startY, 0, startX, startY, hitDist * TS);
    grd.addColorStop(0, color + '55');
    grd.addColorStop(0.6, color + '22');
    grd.addColorStop(1, color + '08');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(aX, aY);
    ctx.lineTo(bX, bY);
    ctx.closePath();
    ctx.fill();
    // края конуса — лёгкие линии того же цвета
    ctx.strokeStyle = color + '99';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(startX, startY); ctx.lineTo(aX, aY);
    ctx.moveTo(startX, startY); ctx.lineTo(bX, bY);
    ctx.stroke();
    // дальняя дуга — обозначает максимальный radius
    ctx.strokeStyle = color + 'bb';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(aX, aY); ctx.lineTo(bX, bY);
    ctx.stroke();
    ctx.restore();
  }
}

function drawCoverBreak(b) {
  const lifeRatio = Math.max(0, b.life / b.max);
  b.particles.forEach(pt => {
    const p = w2s(pt.r, pt.c);
    const liftPx = isoH(pt.z);
    // тень частицы
    ctx.fillStyle = 'rgba(0,0,0,' + (0.35 * lifeRatio).toFixed(2) + ')';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, pt.size * 0.7, pt.size * 0.4, 0, 0, Math.PI*2);
    ctx.fill();
    // сама частица
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = lifeRatio;
    ctx.beginPath();
    ctx.rect(p.x - pt.size/2, p.y - liftPx - pt.size/2, pt.size, pt.size);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawHitSpark(s) {
  const p = w2s(s.r, s.c);
  const t = s.life / s.max;
  // короткая яркая вспышка
  ctx.fillStyle = 'rgba(255,230,160,' + (t * 0.9).toFixed(2) + ')';
  const size = 4 + 4 * (1 - t);
  ctx.beginPath();
  ctx.arc(p.x, p.y - isoH(0.3), size * t, 0, Math.PI*2);
  ctx.fill();
  // пыль/осколки
  ctx.fillStyle = s.color;
  ctx.globalAlpha = t * 0.7;
  for (let i = 0; i < 3; i++) {
    const a = i * 2.0 + (1 - t) * 4;
    const d = (1 - t) * 8;
    ctx.beginPath();
    ctx.arc(p.x + Math.cos(a) * d, p.y - isoH(0.3) + Math.sin(a) * d * 0.5, 1.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFirePuddle(f) {
  const p = w2s(f.r, f.c);
  const t = Math.max(0, f.life / f.max);
  const radPx = f.radius * TS * 0.55;
  // тёмный обугленный круг под лужей
  ctx.fillStyle = 'rgba(20,10,5,' + (0.5 * t).toFixed(2) + ')';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y - isoH(0.05), radPx, radPx * ISO_Y, 0, 0, Math.PI*2);
  ctx.fill();
  // языки пламени (несколько слоёв градиентов)
  const flickr = 0.85 + 0.15 * Math.sin(performance.now() * 0.02);
  for (let i = 0; i < 5; i++) {
    const ang = (performance.now() * 0.001 + i) * 1.7;
    const ox = Math.cos(ang) * radPx * 0.35;
    const oy = Math.sin(ang) * radPx * 0.18;
    const grd = ctx.createRadialGradient(p.x + ox, p.y - isoH(0.1) + oy, 0, p.x + ox, p.y - isoH(0.1) + oy, radPx * 0.7 * flickr);
    grd.addColorStop(0, 'rgba(255,230,120,' + (0.75 * t) + ')');
    grd.addColorStop(0.4, 'rgba(255,140,40,' + (0.55 * t) + ')');
    grd.addColorStop(1, 'rgba(160,40,10,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(p.x + ox, p.y - isoH(0.1) + oy, radPx * 0.7 * flickr, radPx * 0.6 * ISO_Y * flickr, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawExplosion(e) {
  const p = w2s(e.r, e.c);
  const t = e.life / e.max;
  const radius = e.radius * (1 - t * 0.3) * TS;
  const grd = ctx.createRadialGradient(p.x, p.y - isoH(0.3), 0, p.x, p.y - isoH(0.3), radius);
  grd.addColorStop(0, 'rgba(255,255,200,' + t + ')');
  grd.addColorStop(0.3, 'rgba(255,160,40,' + (t * 0.9) + ')');
  grd.addColorStop(0.7, 'rgba(200,50,20,' + (t * 0.6) + ')');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(p.x, p.y - isoH(0.3), radius, 0, Math.PI*2);
  ctx.fill();
}

function render() {
  ctx.fillStyle = '#0b0d12';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 1) Пол — все тайлы 0
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (MAP[r][c] === 0) drawTile(r, c);
    }
  }

  // 1.5) Лужи огня — на полу, под персонажами/укрытиями
  firePuddles.forEach(drawFirePuddle);

  // 2) Объекты с глубиной (укрытия + персонажи + пули). Сортируем по r+c
  const items = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = MAP[r][c];
      if (t > 0) items.push({ depth: r + c, draw: () => drawCover(r, c, t) });
    }
  }
  // игрок
  items.push({ depth: player.r + player.c, draw: () => drawCharacter(player, true) });
  // враги (живые + трупы — трупы остаются на земле)
  enemies.forEach(e => {
    items.push({ depth: e.r + e.c, draw: () => drawCharacter(e, false) });
  });
  // пули (рисуются после всего)
  items.sort((a, b) => a.depth - b.depth);
  items.forEach(i => i.draw());

  // 2.5) Прицел-конус игрока (под пулями, поверх персонажей)
  drawAimGuide();

  // 3) Поверх — пули, вспышки, гранаты, взрывы, разрушение
  bullets.forEach(drawBullet);
  muzzles.forEach(drawMuzzle);
  grenades.forEach(drawGrenade);
  explosions.forEach(drawExplosion);
  coverBreaks.forEach(drawCoverBreak);
  hitSparks.forEach(drawHitSpark);
}

// ── UPDATE ─────────────────────────────────────────────────────────
function update(dt) {
  // тик красной вспышки урона
  if (player.hitT > 0) player.hitT = Math.max(0, player.hitT - dt);

  // AI врагов
  enemies.forEach(e => updateEnemyAI(e, dt));

  // Если игрок мёртв — пропускаем управление
  if (player.hp <= 0) {
    player.fireCD = Math.max(0, player.fireCD - dt * 1000);
    // только обновляем пули и эффекты ниже
  }

  // Движение игрока
  const speed = 4.5; // тайлов/сек
  if (player.hp > 0 && joyL.active && (Math.abs(joyL.dx) > 0.1 || Math.abs(joyL.dy) > 0.1)) {
    // joy.dx (экран X) → ось (c-r) ;  joy.dy (экран Y) → ось (c+r)*ISO_Y
    // Решаем обратно: c-r = dx ; c+r = dy/ISO_Y
    // r = (s - d) / 2, c = (s + d) / 2  где d=dx, s=dy/ISO_Y
    const d = joyL.dx, s = joyL.dy / ISO_Y;
    const dc = (s + d) * 0.5;
    const dr = (s - d) * 0.5;
    const mag = Math.hypot(dr, dc) || 1;
    tryMove(player, dr / mag * speed * dt, dc / mag * speed * dt);
    player.moving = true;
    player.walkPhase += dt * 10;
  } else {
    player.moving = false;
    player.walkPhase *= 0.9;
  }

  // Прицеливание и стрельба
  if (player.hp > 0 && joyR.active && (Math.abs(joyR.dx) > 0.15 || Math.abs(joyR.dy) > 0.15)) {
    // Аналогично: переводим экран → мир
    const d = joyR.dx, s = joyR.dy / ISO_Y;
    const dc = (s + d) * 0.5;
    const dr = (s - d) * 0.5;
    player.angle = Math.atan2(dr, dc);
    // Стрельба (через tryFirePlayer — учитывает патроны/перезарядку)
    tryFirePlayer();
  }
  player.fireCD = Math.max(0, player.fireCD - dt * 1000);

  // Пули
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.r += b.vr * dt;
    b.c += b.vc * dt;
    b.dist += Math.hypot(b.vr, b.vc) * dt;
    // Препятствие (стена/ящик/бочка/машина)? — наносим урон укрытию (стена возвращает true но HP=-1 → жива)
    if (isBlocked(b.r, b.c)) {
      damageCoverAt(b.r, b.c, b.dmg || 25);
      if (b.explosive) triggerExplosion(b.r, b.c, b.dmg || 90);
      bullets.splice(i, 1); continue;
    }
    // Дальность?
    if (b.dist > b.maxDist) {
      if (b.explosive) triggerExplosion(b.r, b.c);
      bullets.splice(i, 1); continue;
    }
    // Попадание в цели (зависит от team)
    let hit = false;
    if (b.team === 'enemy') {
      if (player.hp > 0 && Math.hypot(player.r - b.r, player.c - b.c) < 0.4) {
        player.hp = Math.max(0, player.hp - (b.dmg || 25));
        player.hitT = 0.25;
        if (b.explosive) triggerExplosion(b.r, b.c);
        bullets.splice(i, 1); hit = true;
      }
    } else {
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        if (Math.hypot(e.r - b.r, e.c - b.c) < 0.4) {
          e.hp -= (b.dmg || 25);
          if (e.hp <= 0) e.hp = 0;
          if (b.explosive) triggerExplosion(b.r, b.c);
          bullets.splice(i, 1); hit = true; break;
        }
      }
    }
    if (hit) continue;
  }

  // Гранаты — парабола r/c по времени; на t=T → взрыв (grenade) или лужа огня (molotov)
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.t += dt;
    const k = Math.min(1, g.t / g.T);
    g.r = g.fromR + (g.tr - g.fromR) * k;
    g.c = g.fromC + (g.tc - g.fromC) * k;
    if (k >= 1) {
      if (g.kind === 'molotov') {
        try { _tone({freq:200,freqEnd:80,dur:0.3,type:'sawtooth',vol:0.32}); _noise({dur:0.5,vol:0.28,filter:'lowpass',filterFreq:600}); } catch(e) {}
        spawnFirePuddle(g.r, g.c, g.fromTeam);
      } else {
        triggerExplosion(g.r, g.c, g.dmg);
      }
      grenades.splice(i, 1);
    }
  }

  // Анимация разрушения укрытий — частицы летят по баллистике
  for (let i = coverBreaks.length - 1; i >= 0; i--) {
    const b = coverBreaks[i];
    b.life -= dt * 1000;
    b.particles.forEach(pt => {
      pt.r += pt.vr * dt;
      pt.c += pt.vc * dt;
      pt.z += pt.vz * dt;
      pt.vz -= 7 * dt; // гравитация
      // трение
      pt.vr *= (1 - dt * 1.5);
      pt.vc *= (1 - dt * 1.5);
      if (pt.z < 0) { pt.z = 0; pt.vz = 0; }
    });
    if (b.life <= 0) coverBreaks.splice(i, 1);
  }

  // Искры от попаданий пуль
  for (let i = hitSparks.length - 1; i >= 0; i--) {
    hitSparks[i].life -= dt * 1000;
    if (hitSparks[i].life <= 0) hitSparks.splice(i, 1);
  }

  // Лужи огня — DoT и постепенное угасание
  for (let i = firePuddles.length - 1; i >= 0; i--) {
    const f = firePuddles[i];
    f.life -= dt * 1000;
    f.tickT += dt;
    // тик урона раз в 0.4 сек
    if (f.tickT >= 0.4) {
      f.tickT = 0;
      // игрок
      if (player.hp > 0 && Math.hypot(player.r - f.r, player.c - f.c) < f.radius) {
        player.hp = Math.max(0, player.hp - 8);
        player.hitT = 0.18;
      }
      // враги
      enemies.forEach(e => {
        if (e.hp <= 0) return;
        if (Math.hypot(e.r - f.r, e.c - f.c) < f.radius) e.hp = Math.max(0, e.hp - 6);
      });
      // укрытия
      damageCovers(f.r, f.c, f.radius, 12);
    }
    if (f.life <= 0) firePuddles.splice(i, 1);
  }

  // Вспышки
  for (let i = muzzles.length - 1; i >= 0; i--) {
    muzzles[i].life -= dt * 1000;
    if (muzzles[i].life <= 0) muzzles.splice(i, 1);
  }
  // Взрывы
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].life -= dt * 1000;
    if (explosions[i].life <= 0) explosions.splice(i, 1);
  }

  // Трупы остаются на земле — респауна нет

  // Камера плавно следует за игроком
  const targetCamX = (player.c - player.r) * TS * 0.5;
  const targetCamY = (player.c + player.r) * TS * 0.5 * ISO_Y;
  const camLerp = 1 - Math.pow(0.001, dt); // плавность
  cam.x += (targetCamX - cam.x) * camLerp;
  cam.y += (targetCamY - cam.y) * camLerp;
}

function triggerExplosion(r, c, dmg) {
  const D = dmg || 60;
  explosions.push({ r, c, life: 600, max: 600, radius: 1.8 });
  // урон врагам в радиусе
  enemies.forEach(e => {
    if (e.hp <= 0) return;
    if (Math.hypot(e.r - r, e.c - c) < 2.0) e.hp = Math.max(0, e.hp - D);
  });
  // урон игроку
  if (player.hp > 0 && Math.hypot(player.r - r, player.c - c) < 2.0) {
    player.hp = Math.max(0, player.hp - D);
    player.hitT = 0.35;
  }
  // урон укрытиям в радиусе
  damageCovers(r, c, 2.0, D);
}

function throwGrenade(from, targetR, targetC, team, opts) {
  opts = opts || {};
  const kind = opts.kind || 'grenade';
  _playThrowSound(kind);
  grenades.push({
    fromR: from.r, fromC: from.c,
    tr: targetR, tc: targetC,
    t: 0, T: 1.1, // время полёта 1.1 сек
    r: from.r, c: from.c,
    fromTeam: team || 'enemy',
    kind,
    dmg: opts.dmg || (kind === 'grenade' ? 60 : 22),
  });
}

function spawnFirePuddle(r, c, team) {
  firePuddles.push({ r, c, life: 4000, max: 4000, radius: 1.6, fromTeam: team || 'enemy', tickT: 0 });
}

function fireWeapon(p, weaponKey, team) {
  const wKey = weaponKey || currentWeapon;
  const tm = team || 'player';
  const cfg = WEAPON_FX_CFG[wKey] || WEAPON_FX_CFG.pistol;
  try { cfg.sound(); } catch(e) {}
  p.fireCD = cfg.cd;
  if (cfg.melee) {
    // ближний бой: проверка попадания в радиусе перед носителем
    const tx = p.r + Math.sin(p.angle) * cfg.range;
    const tc = p.c + Math.cos(p.angle) * cfg.range;
    const victims = (tm === 'player') ? enemies : [player];
    victims.forEach(v => {
      if (v.hp <= 0) return;
      if (Math.hypot(v.r - tx, v.c - tc) < 0.9) {
        v.hp = Math.max(0, v.hp - (cfg.dmg || 12));
        if (v === player) player.hitT = 0.25;
      }
    });
    return;
  }

  const speed = 18; // тайлов/сек
  const angle = p.angle;
  const spread = cfg.spread || 0;
  const pellets = cfg.pellets || 1;
  const burst = cfg.burst || 1;
  const burstInt = cfg.burstInterval || 0;

  // Урон врагов ослаблен, иначе их 4 валят за секунду
  const dmgMul = (tm === 'enemy') ? 0.35 : 1;
  const spawnOne = (a) => {
    const dr = Math.sin(a), dc = Math.cos(a);
    bullets.push({
      r: p.r + dr * 0.4, c: p.c + dc * 0.4,
      vr: dr * speed, vc: dc * speed,
      color: cfg.color || '#ffea80',
      thick: cfg.thick || false,
      explosive: cfg.explosive || false,
      dmg: (cfg.dmg || 25) * dmgMul,
      dist: 0, maxDist: cfg.range || 8,
      team: tm,
    });
  };

  for (let b = 0; b < burst; b++) {
    setTimeout(() => {
      for (let i = 0; i < pellets; i++) {
        const a = angle + (Math.random() - 0.5) * spread * 2;
        spawnOne(a);
      }
      muzzles.push({ r: p.r + Math.sin(angle)*0.3, c: p.c + Math.cos(angle)*0.3, life: 80, max: 80 });
    }, b * burstInt);
  }
}

// ── LOS: рейкаст по тайлам (DDA) ───────────────────────────────────
function hasLOS(r1, c1, r2, c2) {
  const dr = r2 - r1, dc = c2 - c1;
  const dist = Math.hypot(dr, dc);
  const steps = Math.ceil(dist * 4);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const r = r1 + dr * t, c = c1 + dc * t;
    if (isBlocked(r, c)) return false;
  }
  return true;
}

// ── AI врагов ──────────────────────────────────────────────────────
function updateEnemyAI(e, dt) {
  if (e.hp <= 0) return;
  e.fireCD = Math.max(0, e.fireCD - dt * 1000);
  e.repositionT = Math.max(0, e.repositionT - dt);
  if (e.isBoss) {
    e.grenadeCD = Math.max(0, e.grenadeCD - dt * 1000);
    e.rushCD = Math.max(0, e.rushCD - dt * 1000);
    e.rushT = Math.max(0, e.rushT - dt);
  }

  const distToPlayer = Math.hypot(player.r - e.r, player.c - e.c);
  const angleToPlayer = Math.atan2(player.r - e.r, player.c - e.c);
  const playerAlive = player.hp > 0;
  const canSee = playerAlive && distToPlayer < e.sightR && hasLOS(e.r, e.c, player.r, player.c);

  // Босс в режиме rush — игнорирует обычное поведение, прёт на игрока
  if (e.isBoss && e.rushT > 0 && playerAlive) {
    e.aiState = 'rush';
    e.angle = angleToPlayer;
    const dr = player.r - e.r, dc = player.c - e.c;
    const d = Math.hypot(dr, dc);
    if (d > 0.5) {
      tryMove(e, dr / d * 7.5 * dt, dc / d * 7.5 * dt);
      e.walkPhase += dt * 16;
    }
    if (d < 1.1 && e.fireCD <= 0) {
      fireWeapon(e, 'bat', 'enemy');
    }
    return;
  }

  // Босс — спецатаки если игрок где-то рядом
  if (e.isBoss && playerAlive && distToPlayer < 12) {
    // граната: каждые ~6 сек.
    // Если игрока НЕ видно (он за стенкой/укрытием) — кидаем молотов: лужа огня выкуривает.
    // Если видно — обычная граната.
    if (e.grenadeCD <= 0 && distToPlayer > 2.5 && distToPlayer < 10) {
      const kind = canSee ? 'grenade' : 'molotov';
      const dmg = kind === 'grenade' ? 80 : 0; // молотов урон через DoT в луже
      throwGrenade(e, player.r, player.c, 'enemy', { kind, dmg });
      e.grenadeCD = 6500 + Math.random() * 2500;
      e.fireCD = Math.max(e.fireCD, 800);
    }
    // rush: каждые ~9 сек, если игрок не вплотную и есть LOS
    if (e.rushCD <= 0 && distToPlayer > 3 && distToPlayer < 9 && canSee) {
      e.rushT = 1.2;
      e.rushCD = 10000 + Math.random() * 3000;
    }
  }

  if (canSee) {
    e.angle = angleToPlayer;
    const cfg = WEAPON_FX_CFG[e.weapon] || WEAPON_FX_CFG.pistol;
    const optRange = (cfg.range || 8) * 0.7;
    // Стреляем если в дистанции (с разбросом прицела, чтобы не вальнули с одного выстрела)
    if (distToPlayer < (cfg.range || 8) && e.fireCD <= 0) {
      const aimErr = (Math.random() - 0.5) * (e.isBoss ? 0.16 : 0.28);
      const saveAngle = e.angle;
      e.angle = angleToPlayer + aimErr;
      fireWeapon(e, e.weapon, 'enemy');
      e.angle = saveAngle;
    }
    // Перемещение: держим дистанцию + стрейф
    e.aiState = 'shoot';
    if (e.repositionT <= 0) {
      // выбираем новую точку чтобы стрейфить
      const strafe = (Math.random() - 0.5) * Math.PI;
      const targetDist = Math.max(2.5, optRange * 0.6);
      e.targetR = player.r + Math.sin(angleToPlayer + Math.PI + strafe) * targetDist;
      e.targetC = player.c + Math.cos(angleToPlayer + Math.PI + strafe) * targetDist;
      e.repositionT = 1.0 + Math.random() * 1.5;
    }
    // движемся к targetR/C если оно задано и далеко
    moveTowardsTarget(e, dt, e.isBoss ? 2.2 : 2.8);
  } else if (playerAlive && distToPlayer < e.sightR * 1.6) {
    // Слышим игрока — идём в его сторону
    e.aiState = 'chase';
    e.angle = angleToPlayer;
    e.targetR = player.r; e.targetC = player.c;
    moveTowardsTarget(e, dt, e.isBoss ? 2.5 : 3.2);
  } else {
    // патруль
    e.aiState = 'patrol';
    if (e.repositionT <= 0 || e.targetR == null) {
      // случайная точка в открытом тайле
      for (let tries = 0; tries < 20; tries++) {
        const rr = 1 + Math.random() * (ROWS - 2);
        const cc = 1 + Math.random() * (COLS - 2);
        if (!isBlocked(rr, cc)) { e.targetR = rr; e.targetC = cc; break; }
      }
      e.repositionT = 2.5 + Math.random() * 2.5;
    }
    moveTowardsTarget(e, dt, 1.6);
  }
}

function moveTowardsTarget(e, dt, speed) {
  if (e.targetR == null) return;
  const dr = e.targetR - e.r, dc = e.targetC - e.c;
  const d = Math.hypot(dr, dc);
  if (d < 0.2) { e.walkPhase *= 0.85; return; }
  const vr = dr / d * speed, vc = dc / d * speed;
  const before = { r: e.r, c: e.c };
  tryMove(e, vr * dt, vc * dt);
  // если уперлись — сбросим точку, чтобы выбрать новую
  if (Math.abs(e.r - before.r) < 0.001 && Math.abs(e.c - before.c) < 0.001) {
    e.repositionT = 0;
  }
  e.walkPhase += dt * 10;
  if (e.aiState !== 'shoot') e.angle = Math.atan2(vr, vc);
}

// ── ВВОД (джойстики) ───────────────────────────────────────────────
const stage = document.getElementById('stage');
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const aimBase = document.getElementById('aimBase');
const aimKnob = document.getElementById('aimKnob');
const JOY_RADIUS = 55;

function startTouch(x, y, id) {
  const stageW = stage.clientWidth;
  if (x < stageW / 2) {
    if (joyL.active) return;
    joyL.active = true; joyL.id = id; joyL.ox = x; joyL.oy = y;
    joyL.dx = 0; joyL.dy = 0;
    joyBase.style.left = (x - 55) + 'px';
    joyBase.style.top  = (y - 55) + 'px';
    joyBase.classList.add('on');
    joyKnob.style.transform = 'translate(0,0)';
  } else {
    if (joyR.active) return;
    joyR.active = true; joyR.id = id; joyR.ox = x; joyR.oy = y;
    joyR.dx = 0; joyR.dy = 0;
    aimBase.style.left = (x - 55) + 'px';
    aimBase.style.top  = (y - 55) + 'px';
    aimBase.classList.add('on');
    aimKnob.style.transform = 'translate(0,0)';
    // первый выстрел сразу, как только палец легли (только если игрок жив)
    if (player.hp > 0 && player.fireCD <= 0) {
      // нужно, чтобы был angle — будем считать что нажал = смотрит вверх если не двигает
      player.angle = -Math.PI / 2;
      tryFirePlayer();
    }
  }
}

function moveTouch(x, y, id) {
  if (joyL.active && joyL.id === id) {
    let dx = x - joyL.ox, dy = y - joyL.oy;
    const d = Math.hypot(dx, dy);
    if (d > JOY_RADIUS) { dx = dx / d * JOY_RADIUS; dy = dy / d * JOY_RADIUS; }
    joyL.dx = dx / JOY_RADIUS;
    joyL.dy = dy / JOY_RADIUS;
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  if (joyR.active && joyR.id === id) {
    let dx = x - joyR.ox, dy = y - joyR.oy;
    const d = Math.hypot(dx, dy);
    if (d > JOY_RADIUS) { dx = dx / d * JOY_RADIUS; dy = dy / d * JOY_RADIUS; }
    joyR.dx = dx / JOY_RADIUS;
    joyR.dy = dy / JOY_RADIUS;
    aimKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  }
}

function endTouch(id) {
  if (joyL.active && joyL.id === id) {
    joyL.active = false; joyL.dx = 0; joyL.dy = 0;
    joyBase.classList.remove('on');
  }
  if (joyR.active && joyR.id === id) {
    joyR.active = false; joyR.dx = 0; joyR.dy = 0;
    aimBase.classList.remove('on');
  }
}

stage.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rect = stage.getBoundingClientRect();
    startTouch(t.clientX - rect.left, t.clientY - rect.top, t.identifier);
  }
}, { passive: false });
stage.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rect = stage.getBoundingClientRect();
    moveTouch(t.clientX - rect.left, t.clientY - rect.top, t.identifier);
  }
}, { passive: false });
stage.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) endTouch(t.identifier);
}, { passive: false });
stage.addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) endTouch(t.identifier);
}, { passive: false });

// Мышь — для desktop
stage.addEventListener('mousedown', (e) => {
  const rect = stage.getBoundingClientRect();
  startTouch(e.clientX - rect.left, e.clientY - rect.top, 'mouse-' + e.button);
});
window.addEventListener('mousemove', (e) => {
  const rect = stage.getBoundingClientRect();
  moveTouch(e.clientX - rect.left, e.clientY - rect.top, 'mouse-0');
  moveTouch(e.clientX - rect.left, e.clientY - rect.top, 'mouse-2');
});
window.addEventListener('mouseup', (e) => {
  endTouch('mouse-' + e.button);
});
stage.addEventListener('contextmenu', (e) => e.preventDefault());

// Селектор оружия
let lastMeleeWeapon = 'fists'; // последнее выбранное melee — для кнопки ближнего боя
let preMeleeWeapon = 'pistol'; // куда вернуться после атаки в ближнем бою с пустым магазином
document.querySelectorAll('.wbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.wbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentWeapon = btn.dataset.wep;
    document.getElementById('wepName').textContent = btn.textContent;
    const cfg = WEAPON_FX_CFG[currentWeapon];
    if (cfg && cfg.melee) lastMeleeWeapon = currentWeapon;
    else preMeleeWeapon = currentWeapon;
    if (cfg && cfg.sound) { try { cfg.sound(); } catch(e) {} }
    updateMeleeBtn();
  });
});

// Кнопка melee — переключает на ближний бой / делает атаку если уже на melee
const MELEE_ICONS = { fists: '👊', brass: '✊', chain: '⛓', bat: '🏏', blade_short: '🗡', blade_long: '⚔', katana: '⚔' };
const MELEE_LABELS = { fists: 'кулаки', brass: 'кастет', chain: 'цепь', bat: 'бита', blade_short: 'нож', blade_long: 'катана' };
function updateMeleeBtn() {
  const icon = document.getElementById('meleeIcon');
  const label = document.getElementById('meleeLabel');
  if (icon) icon.textContent = MELEE_ICONS[lastMeleeWeapon] || '👊';
  if (label) label.textContent = MELEE_LABELS[lastMeleeWeapon] || 'кулаки';
}
document.getElementById('meleeBtn').addEventListener('click', () => {
  if (player.hp <= 0) return;
  const curCfg = WEAPON_FX_CFG[currentWeapon];
  if (curCfg && curCfg.melee) {
    // уже в melee → бьём (выставляем angle если не задан)
    if (player.fireCD <= 0) {
      if (player.angle == null) player.angle = -Math.PI / 2;
      fireWeapon(player);
    }
  } else {
    // переключение на melee
    document.querySelectorAll('.wbtn').forEach(b => {
      b.classList.toggle('active', b.dataset.wep === lastMeleeWeapon);
    });
    currentWeapon = lastMeleeWeapon;
    document.getElementById('wepName').textContent = MELEE_LABELS[lastMeleeWeapon] || lastMeleeWeapon;
  }
});

// Кнопка перезарядки
document.getElementById('reloadBtn').addEventListener('click', () => manualReload());
window.addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') manualReload(); });

// ── Мини-карта ─────────────────────────────────────────────────────
const mm = document.getElementById('minimap');
const mctx = mm.getContext('2d');
function renderMinimap() {
  const mw = mm.width, mh = mm.height;
  const cellW = mw / COLS, cellH = mh / ROWS;
  mctx.fillStyle = '#0a0d14'; mctx.fillRect(0, 0, mw, mh);
  // тайлы
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = MAP[r][c];
      if (t === 0) continue;
      mctx.fillStyle = (t === 1) ? '#444' : (t === 3 ? '#604040' : '#604830');
      mctx.fillRect(c * cellW, r * cellH, cellW, cellH);
    }
  }
  // трупы (тёмные точки)
  enemies.forEach(e => {
    if (e.hp > 0) return;
    mctx.fillStyle = '#5a1010';
    mctx.beginPath();
    mctx.arc(e.c * cellW + cellW/2, e.r * cellH + cellH/2, Math.min(cellW, cellH) * 0.22, 0, Math.PI*2);
    mctx.fill();
  });
  // живые враги (красные/сиреневые)
  enemies.forEach(e => {
    if (e.hp <= 0) return;
    mctx.fillStyle = e.isBoss ? '#c060ff' : '#ff3030';
    mctx.beginPath();
    const radius = e.isBoss ? Math.min(cellW, cellH) * 0.5 : Math.min(cellW, cellH) * 0.35;
    mctx.arc(e.c * cellW + cellW/2, e.r * cellH + cellH/2, radius, 0, Math.PI*2);
    mctx.fill();
    if (e.isBoss) {
      mctx.strokeStyle = '#fff'; mctx.lineWidth = 1;
      mctx.stroke();
    }
  });
  // игрок (зелёный)
  mctx.fillStyle = '#5dd55d';
  mctx.beginPath();
  mctx.arc(player.c * cellW + cellW/2, player.r * cellH + cellH/2, Math.min(cellW, cellH) * 0.42, 0, Math.PI*2);
  mctx.fill();
  mctx.strokeStyle = '#fff'; mctx.lineWidth = 1.5;
  mctx.stroke();
  // направление взгляда игрока
  const dx = Math.cos(player.angle), dy = Math.sin(player.angle);
  mctx.strokeStyle = '#5dd55d'; mctx.lineWidth = 2;
  mctx.beginPath();
  mctx.moveTo(player.c * cellW + cellW/2, player.r * cellH + cellH/2);
  mctx.lineTo(player.c * cellW + cellW/2 + dx * cellW * 1.2, player.r * cellH + cellH/2 + dy * cellH * 1.2);
  mctx.stroke();
}

// ── Кнопки: перегенерировать игрока / врагов ───────────────────────
document.getElementById('rerollBtn').addEventListener('click', () => {
  player.look = rndLook();
  savePlayerLook(player.look);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  enemies[0].hp = enemies[0].hpMax; enemies[0].r = 2.5; enemies[0].c = 6.5;
  for (let i = 1; i < enemies.length; i++) {
    enemies[i].hp = enemies[i].hpMax;
    enemies[i].look = rndLook();
  }
  enemies[1].r = 12.5; enemies[1].c = 9.5;
  enemies[2].r = 14.5; enemies[2].c = 3.0;
  if (enemies[3]) { enemies[3].r = 5.5; enemies[3].c = 2.5; }
  enemies.forEach(e => {
    e.aiState = 'patrol'; e.targetR = null; e.targetC = null;
    e.repositionT = 0; e.fireCD = 0;
    if (e.isBoss) { e.grenadeCD = 4000; e.rushCD = 9000; e.rushT = 0; }
  });
  bullets.length = 0; grenades.length = 0; explosions.length = 0; muzzles.length = 0; firePuddles.length = 0;
  coverBreaks.length = 0; hitSparks.length = 0;
  // восстанавливаем карту и HP укрытий
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) MAP[r][c] = MAP_ORIGINAL[r][c];
  initCoverHP();
  // сбрасываем патроны игрока
  player.ammo = {};
  player.hp = player.hpMax;
  player.r = 8.5; player.c = 8.5;
  player.hitT = 0;
});

// ── Game loop ──────────────────────────────────────────────────────
let lastT = performance.now();
let fpsAcc = 0, fpsN = 0, fpsLast = lastT;
let mmFrame = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  update(dt);
  render();
  // Мини-карта — раз в 5 кадров
  if (++mmFrame % 5 === 0) renderMinimap();

  // HUD: HP-бар + красная вспышка + game over
  const hpEl = document.getElementById('hpVal');
  const hpBar = document.getElementById('hpBar');
  const flash = document.getElementById('hitFlash');
  const go = document.getElementById('gameOver');
  if (hpEl) hpEl.textContent = Math.round(player.hp);
  if (hpBar) {
    const ratio = player.hp / player.hpMax;
    hpBar.style.width = (ratio * 100) + '%';
    hpBar.style.background = ratio > 0.5 ? 'linear-gradient(90deg,#5dd55d,#3aa53a)'
      : ratio > 0.25 ? 'linear-gradient(90deg,#ffd24a,#cf8a20)'
      : 'linear-gradient(90deg,#ff5050,#a02020)';
  }
  if (flash) flash.style.background = 'rgba(255,40,40,' + (player.hitT * 1.6).toFixed(2) + ')';
  if (go) go.style.display = (player.hp <= 0) ? 'flex' : 'none';

  // Индикатор патронов и перезарядки
  const ammoText = document.getElementById('ammoText');
  const reloadBar = document.getElementById('reloadBar');
  const cfg = WEAPON_FX_CFG[currentWeapon];
  if (cfg && cfg.melee) {
    if (ammoText) ammoText.textContent = '∞ (ближний бой)';
    if (reloadBar) reloadBar.style.width = '0%';
  } else if (cfg) {
    const a = getAmmo(currentWeapon);
    if (a && ammoText) ammoText.textContent = a.cur + ' / ' + cfg.mag;
    if (a && a.reloading && reloadBar) {
      const now = performance.now();
      const rT = Math.max(0, a.reloadEnd - now);
      const ratio = 1 - rT / (cfg.reload || 1500);
      reloadBar.style.width = (ratio * 100).toFixed(0) + '%';
    } else if (reloadBar) {
      reloadBar.style.width = '0%';
    }
  }
  fpsAcc++; fpsN++;
  if (t - fpsLast > 500) {
    document.getElementById('fps').textContent = Math.round(fpsAcc / ((t - fpsLast) / 1000));
    fpsAcc = 0; fpsLast = t;
  }
  requestAnimationFrame(loop);
}

resize();
initCoverHP();
updateMeleeBtn();
// Сохраняем оригинальную карту для респа
const MAP_ORIGINAL = MAP.map(row => row.slice());
requestAnimationFrame(loop);
</script>
</body>
</html>
